name: Release

# Runs when a version tag is pushed: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the manifest version
        run: node scripts/check.js --tag "$GITHUB_REF_NAME"

      - name: Build the package
        run: node scripts/build.js

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.js > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file release-notes.md

      # Skipped until the store credentials are added as repository secrets.
      - name: Upload to the Chrome Web Store and submit for review
        if: env.CWS_REFRESH_TOKEN != ''
        run: node scripts/publish-cws.js dist/*.zip
